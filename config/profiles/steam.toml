landlock = false
features = ["vulkan", "bin", "locale", "dri", "passwd", "https", "ld", "wayland", "fonts", "pipewire", "xorg", "themes", "tray"]
conflicts = ["hardened_malloc"]
seccomp = "Disabled"
devices = ["/dev"]
namespaces = ["User"]

[home]
policy = "Enabled"

[ipc]
user_bus = true

[files.platform]
ro = ["/etc/machine-id", "/sys", "/run/udev"]
rw = ["/dev/shm"]

[libraries]
no_sof = true
roots = ["/usr/lib32"]
