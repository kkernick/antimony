landlock = false
features = ["xorg", "fonts", "vulkan", "https", "bin", "wayland", "dri", "locale", "passwd", "ld", "pipewire", "themes", "tray", "udev", "sys", "dev"]
conflicts = ["hardened_malloc"]
seccomp = "Disabled"
namespaces = ["User"]

[home]
policy = "Enabled"

[ipc]
user_bus = true

[files.platform]
rw = ["/dev/shm"]

[libraries]
no_sof = true
roots = ["/usr/lib32"]
