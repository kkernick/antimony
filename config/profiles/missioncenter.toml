id = "io.missioncenter.MissionCenter"
features = ["sys", "libadwaita", "cgroup", "gio", "passwd", "applications", "network"]
binaries = ["missioncenter-magpie", "/usr/share/antimony/utilities/antimony-spawn=/app/bin/missioncenter-spawner", "sh"]
devices = ["/dev/udmabuf"]
namespaces = ["Pid"]

[files.platform]
ro = ["/run/udev/data"]

[files.links]
"/usr/bin/missioncenter-magpie" = "/usr/bin/missioncenter-magpie-glibc"

[libraries]
files = ["libdrm*"]
