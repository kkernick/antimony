id = "libreoffice-startcenter"
features = ["locale", "passwd", "qt6", "gtk4"]
binaries = ["uname", "dirname", "sed", "grep", "basename", "ls"]

[home]
policy = "Enabled"

[configuration.base]
id = "libreoffice-base"
arguments = ["--base"]

[configuration.draw]
id = "libreoffice-draw"
arguments = ["--draw"]

[configuration.impress]
id = "libreoffice-impress"
arguments = ["--impress"]

[configuration.writer]
id = "libreoffice-writer"
arguments = ["--writer"]

[configuration.calc]
id = "libreoffice-calc"
arguments = ["--calc"]

[configuration.math]
id = "libreoffice-math"
arguments = ["--math"]
