features = ["gtksourceview", "python", "gtk3", "network"]

[home]
policy = "Enabled"

[ipc]
system_bus = true
owns = ["org.virt-manager.virt-manager"]
sockets = ["/var/run/libvirt"]

[files.platform]
ro = ["/usr/share/hwdata", "/sys", "/var/run/libvirt", "/usr/share/misc", "/usr/share/osinfo"]

[files.permissions]
"/var/cache" = "rw"

[libraries]
files = ["libosinfo*", "libspice-client*", "libvirt*"]
directories = ["libvirt"]
