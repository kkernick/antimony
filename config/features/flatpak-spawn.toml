name = "flatpak-spawn"
description = "Use Antimony-Spawn to permit sandboxes to run other applications under Antimony."
landlock = false
binaries = ["bwrap", "$AT_HOME/utilities/antimony-spawn=/usr/bin/flatpak-spawn", "bash"]
namespaces = ["User"]

[files.platform]
ro = ["/etc/antimony.d", "/usr/share/antimony/utilities", "/etc/antimony.toml"]

[files.permissions]
"/usr/share/antimony/utilities" = "rx"
