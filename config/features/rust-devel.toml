name = "rust-devel"
description = "Provide Rust and its associated development tools."
requires = ["hostname", "gcc"]
binaries = ["rustup", "cargo-clippy", "nm", "cargo-fmt", "ld.lld", "strip", "cargo", "rustc", "clippy-driver", "rustdoc", "rustfmt"]

[environment]
RUSTUP_HOME = "$RUSTUP_HOME"
CARGO_HOME = "$CARGO_HOME"

[libraries]
no_sof = true

[files.user]
rw = ["$CARGO_HOME", "$RUSTUP_HOME"]
