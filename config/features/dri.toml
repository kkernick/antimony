name = "dri"
description = "DRI for accelerated video rendering"
devices = ["/dev/udmabuf", "/dev/dri"]

[libraries]
files = ["libEGL*", "libGL*", "libgallium*", "libMesa*"]
directories = ["dri", "gbm"]

[files.platform]
ro = ["/usr/share/glvnd", "/sys/dev/char", "/usr/share/libdrm", "/usr/share/drirc.d", "/etc/OpenCL/", "/sys/devices/pci0000:00"]
