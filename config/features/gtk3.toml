name = "gtk3"
description = "For GTK3 applications"
requires = ["dri", "fonts", "themes", "gdk-pixbuf", "mime", "accessibility", "wayland", "vulkan"]

[environment]
GTK_A11Y = "none"
GTK_USE_PORTAL = "1"

[libraries]
files = ["libgdk-3*", "libgtk-3*"]
directories = ["gtk-3.0", "tinysparql-3.0"]

[ipc]
owns = ["{desktop}"]

[files.user]
ro = ["$XDG_CONFIG_HOME/gtkrc", "$XDG_CONFIG_HOME/gtk-2.0", "$XDG_CONFIG_HOME/gtk-3.0", "$HOME/.gtkrc-2.0", "$XDG_CONFIG_HOME/gtkrc-2.0"]

[files.platform]
ro = ["/etc/xdg/gtk-3.0/"]

[files.resources]
ro = ["/usr/share/gtk-3.0", "/usr/share/gtk", "/usr/share/gtk-2.0", "/usr/share/glib-2.0"]
