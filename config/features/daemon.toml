name = "daemon"
description = "Catch daemons to wait for spawned children to exit"
conditional = "command -v /usr/bin/sh"
requires = ["shell"]
binaries = ["ps", "wc", "sh", "sleep"]
sandbox_args = ["#", "daemon-wait"]

[files.direct.rx]
"/usr/bin/daemon-wait" = """
#!/bin/sh
CURRENT=$(ps | wc -l)
echo "Initial processes: $CURRENT"
$@
while [ $(ps | wc -l ) -gt $CURRENT ]; do
    sleep 1;
done
"""
