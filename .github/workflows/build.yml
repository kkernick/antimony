name: Build Packages

on:
  push:
    tags:
      - "*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev sqlite3 libsqlite3-dev ruby-dev libarchive-tools pkg-config libdbus-1-dev gcc bubblewrap xdg-dbus-proxy
          sudo gem install fpm

      - name: Extract version number
        id: extract_version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run package script
        run: |
          ./scripts/cargo-packager "${{ steps.extract_version.outputs.version }}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            generated/antimony-sandbox-${{ steps.extract_version.outputs.version }}-1-x86_64.pkg.tar.zst
            generated/antimony-sandbox_${{ steps.extract_version.outputs.version }}-1_amd64.deb
            generated/antimony-sandbox-${{ steps.extract_version.outputs.version }}-1.x86_64.rpm
